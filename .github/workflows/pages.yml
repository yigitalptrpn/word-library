name: GitHub Pages

on:
  push:
    branches:
      - claude/kelime-kutuphanesi-app-inm1r1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Veri butunlugunu dogrula
        run: python3 tools/check_sentences.py

      - uses: actions/configure-pages@v5

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          # Site depo kokunde duruyor; tools/ ve .github/ yayina girmez.
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
